<title>nano-cloud</title>
<style>

/* Warm editorial design tokens, shared by the three HTML entry points. */
:root {
  color-scheme:light;
  --bg-page:#f6f4ee; --glass:#fffdf8; --glass-strong:#fffdf8;
  --text:#302e29; --text-2:#655f56; --text-3:#787066;
  --stroke:#e4dfd5; --stroke-strong:#cec7ba; --blue:#a64f36;
  --accent:#a64f36; --accent-soft:#f0e1d7; --success:#35664c;
  --warning:#8a5b18; --danger:#a13c32;
  --sf-soft:#f8f6f0; --sf:#efece4; --sf-strong:#e9e4d9;
  --sf-input:#fffdf8; --sf-input-focus:#fffdf8;
  --track-bg:#ded8cc; --bar-bg:#eae4d9;
  --tbl-divider:#ece7dd; --tbl-hover:#f6f2e9; --tbl-row-border:#ece7dd;
  --scrollbar-thumb:#c8c0b3; --radius:12px;
  --display:"Songti SC","STSong",Georgia,"Times New Roman",serif;
  --body:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; }
body { font-family:var(--body); color:var(--text); background:var(--bg-page); font-size:15px; line-height:1.65; min-height:100vh; overflow-x:hidden; }
::selection { background:var(--accent-soft); }
button,input,select,textarea { font:inherit; }
button,a,input,select,textarea { -webkit-tap-highlight-color:transparent; }
button,a { touch-action:manipulation; }
a { color:var(--accent); text-underline-offset:4px; }
a:hover { text-decoration:underline; }
h1,h2,h3,p { text-wrap:pretty; }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
input:focus,textarea:focus,select:focus { border-color:var(--accent)!important; }
input::placeholder,textarea::placeholder { color:var(--text-3); }
button { cursor:pointer; }
button:disabled,.btn[disabled] { opacity:.45; cursor:not-allowed; pointer-events:none; }
button:active,.btn:active { transform:translateY(1px); }
.orb { display:none; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:var(--scrollbar-thumb); border:2px solid var(--bg-page); border-radius:8px; }
.mono { font-family:ui-monospace,"SF Mono",monospace; font-size:13px; }
.btn,.lang-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:40px; padding:9px 16px; border:1px solid var(--stroke-strong); border-radius:8px; background:var(--glass); color:var(--text); font-size:14px; font-weight:500; text-decoration:none; transition:background .15s,border-color .15s; }
.btn:hover,.lang-btn:hover { background:var(--sf); border-color:var(--text-3); text-decoration:none; }
.btn.primary { background:var(--accent); color:#fffdf8; border-color:var(--accent); }
.btn.primary:hover { filter:brightness(.94); }
.btn.danger { color:var(--danger); background:transparent; border-color:var(--stroke-strong); }
.btn.danger:hover { background:var(--accent-soft); }
.btn.sm { min-height:34px; padding:6px 11px; font-size:13px; }
.empty { text-align:center; padding:48px 20px; color:var(--text-3); }
.empty .icon,.empty .emoji { font-size:32px; margin-bottom:12px; }
.spin,.spinner { width:28px; height:28px; margin:28px auto; border:2px solid var(--stroke); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes shake { 0%,100% { transform:translateX(0); } 25%,75% { transform:translateX(-4px); } 50% { transform:translateX(4px); } }
.shake,.pw.shake input { animation:shake .25s; }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition:none!important; scroll-behavior:auto!important; } }

h1,h3 { font-family:var(--display); font-weight:500; }
body { padding:32px 24px 80px; }
.card { background:var(--glass); border:1px solid var(--stroke); border-radius:14px; box-shadow:none; }
.meta,.hint,.subtitle,.sub,footer { color:var(--text-3); }
.warn { padding:14px 16px; margin-top:18px; border:1px solid var(--stroke-strong); background:var(--accent-soft); color:var(--warning); border-radius:8px; font-size:14px; }
.loading { padding:60px 0; text-align:center; }
.lang-btn { font-size:13px; min-height:36px; padding:6px 12px; }
.brand-icon,.icon { background:var(--sf); border:1px solid var(--stroke); color:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; }

body { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:72px 20px 100px; }
.card { width:100%; max-width:480px; padding:42px 36px 36px; text-align:center; }
.file-icon { display:flex; align-items:center; justify-content:center; width:70px; height:82px; margin:0 auto 26px; border-radius:8px; background:var(--sf); border:1px solid var(--stroke); color:var(--accent); }
.file-icon .ext { font:500 19px ui-monospace,monospace; }
h1 { font-size:30px; line-height:1.5; overflow-wrap:anywhere; }
.meta { margin-top:14px; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:10px; font-size:14px; }.meta .dot { width:3px; height:3px; border-radius:50%; background:var(--text-3); }
.stats { display:flex; gap:0; padding:20px 0; margin-top:26px; border-top:1px solid var(--stroke); border-bottom:1px solid var(--stroke); }.stat { flex:1; padding:0 8px; }.stat + .stat { border-left:1px solid var(--stroke); }.stat .v { font:500 23px var(--display); }.stat .k { font-size:13px; color:var(--text-3); margin-top:6px; }
.card .btn { display:flex; width:100%; margin-top:24px; padding:13px 16px; background:var(--accent); border-color:var(--accent); color:#fffdf8; min-height:48px; font-size:16px; }.btn svg { width:19px; height:19px; }
#copy-direct { background:var(--sf)!important; border-color:var(--stroke)!important; color:var(--text-2)!important; font-size:14px!important; }
.hint,.pw-hint { margin-top:14px; color:var(--text-3); font-size:14px; line-height:1.8; }
.brand { position:static; text-align:center; margin-top:28px; color:var(--text-3); font-size:13px; }.brand b { font-weight:500; }.brand .lang-btn { margin-left:10px; }
.octo-float,.code-float { position:fixed; display:flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:10px; border:1px solid var(--stroke-strong); background:var(--glass); color:var(--accent); z-index:50; cursor:pointer; }.octo-float { right:max(18px,env(safe-area-inset-right)); bottom:max(18px,env(safe-area-inset-bottom)); }.code-float { top:max(18px,env(safe-area-inset-top)); left:max(18px,env(safe-area-inset-left)); }.code-float.position-right { left:auto; right:max(18px,env(safe-area-inset-right)); }.octo-float svg,.code-float svg { width:22px; height:22px; color:var(--accent); }.code-float .badge { position:absolute; top:-3px; right:-3px; width:11px; height:11px; border-radius:50%; background:var(--success); border:2px solid var(--bg-page); }
.pw input,.code-input-row input { width:100%; padding:13px 16px; margin-top:22px; font-size:16px; border:1px solid var(--stroke-strong); border-radius:8px; background:var(--sf-input); color:var(--text); outline:none; }.pw input { text-align:center; }.pw .err { margin-top:10px; font-size:14px; color:var(--danger); min-height:20px; }
.ts-wrap { display:flex; justify-content:center; margin-top:22px; }.ts-passed { padding:12px; margin-top:22px; color:var(--success); background:var(--sf); border:1px solid var(--stroke); border-radius:8px; font-size:14px; }.ts-blocked-title { margin-top:22px; color:var(--warning); }.ts-blocked-hint { margin-top:8px; color:var(--text-3); font-size:14px; }
.code-modal-mask { position:fixed; inset:0; z-index:100; background:rgba(35,31,25,.35); display:flex; align-items:center; justify-content:center; padding:20px; }.code-modal { width:100%; max-width:430px; max-height:85vh; overflow-y:auto; padding:28px; background:var(--glass); border:1px solid var(--stroke); border-radius:14px; box-shadow:0 18px 60px rgba(35,31,25,.15); }.code-modal h3 { font-size:26px; margin-bottom:8px; }.code-modal .sub { font-size:14px; }.code-modal .close { position:absolute; top:14px; right:14px; width:32px; height:32px; border:1px solid var(--stroke); border-radius:7px; background:var(--sf); color:var(--text); }
.code-bound-row { margin-top:20px; padding:16px; background:var(--sf); border:1px solid var(--stroke); border-radius:8px; }.code-bound-row .label { font-size:13px; color:var(--success); }.code-bound-row .code { font:14px ui-monospace,monospace; margin-top:8px; overflow-wrap:anywhere; }.code-bound-row .detail { font-size:13px; margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; }.unbind-btn { border:1px solid var(--stroke-strong); border-radius:6px; padding:6px 10px; background:var(--glass); color:var(--text-2); }
.code-input-row { margin-top:20px; }.code-input-row input { margin-top:0; font-family:ui-monospace,monospace; }.code-btn-row { display:flex; gap:10px; margin-top:12px; }.code-btn-row button { flex:1; padding:11px; border:1px solid var(--stroke-strong); border-radius:7px; background:var(--sf); color:var(--text); font-size:14px; }.code-btn-row button.primary { background:var(--accent); color:#fffdf8; border-color:var(--accent); }
.code-query-result { margin-top:14px; padding:12px; border:1px solid var(--stroke); border-radius:7px; font-size:14px; color:var(--text-2); }.code-query-result.ok { color:var(--success); }.code-query-result.warn { color:var(--warning); }.code-query-result.err { color:var(--danger); }.code-progress { height:4px; background:var(--bar-bg); margin-top:10px; overflow:hidden; }.code-progress i { display:block; height:100%; background:var(--accent); }
@media(max-width:500px) { .card { padding:32px 22px; } h1 { font-size:26px; }.code-modal { padding:24px 20px; }.ts-wrap { margin-left:-10px; margin-right:-10px; } }
.code-float[hidden],.octo-float[hidden] { display:none; }.code-float:not(.position-right) { top:max(80px,env(safe-area-inset-top)); }

/* Retheme legacy inline presentation without changing its JavaScript. */
[style*="color:rgba(255,255,255"], [style*="color: rgba(255,255,255"] { color:var(--text-2)!important; }
[style*="color:#6ee7b7"], [style*="color:#34d399"], [style*="color:#16a34a"] { color:var(--success)!important; }
[style*="color:#fcd34d"], [style*="color:#fde68a"], [style*="color:#ffd9a0"], [style*="color:#d97706"] { color:var(--warning)!important; }
[style*="color:#fda293"], [style*="color:#ef4444"] { color:var(--danger)!important; }
[style*="color:#a5b4fc"], [style*="color:#60a5fa"] { color:var(--accent)!important; }
.modal [style*="background:rgba(0,0,0"], .section [style*="background:rgba(0,0,0"] { background:var(--sf)!important; }
.logo svg { width:24px; height:24px; color:var(--accent); }
.login-card .logo svg { width:32px; height:32px; }

.oauth-block a.btn { background:var(--accent)!important; color:#fffdf8!important; border-radius:8px!important; box-shadow:none!important; }
.oauth-block #oauth-logout { color:var(--text-2)!important; }
#copy-direct { background:var(--sf)!important; color:var(--text)!important; }

.page-brand { position:absolute; top:max(20px,env(safe-area-inset-top)); left:max(20px,env(safe-area-inset-left)); display:flex; align-items:center; gap:10px; color:var(--text); font-weight:500; }
.page-brand img { display:block; border-radius:10px; flex:none; }
body { padding-top:100px; }

@media(max-width:600px) {
 body { justify-content:flex-start; min-height:100dvh; padding:96px 12px max(82px,env(safe-area-inset-bottom)); }
 .page-brand { top:max(16px,env(safe-area-inset-top)); left:max(16px,env(safe-area-inset-left)); }
 .card { padding:26px 18px; }
 .file-icon { width:54px; height:64px; margin-bottom:18px; }
 h1 { font-size:24px; line-height:1.4; }
 .meta { font-size:13px; gap:8px; }
 .stats { margin-top:20px; padding:16px 0; }
 .stat .v { font-size:21px; }
 .card .btn { min-height:50px; margin-top:18px; }
 .lang-btn,#oauth-logout,.unbind-btn { min-height:44px; }
 .code-modal-mask { align-items:flex-end; padding:0; }
 .code-modal { max-width:100%; max-height:calc(100dvh - 20px); padding:24px 20px max(24px,env(safe-area-inset-bottom)); border-radius:18px 18px 0 0; overscroll-behavior:contain; }
 .code-modal .close { width:44px; height:44px; }
 .code-modal h3 { padding-right:40px; }
 .code-btn-row button { min-height:48px; }
 .code-bound-row .detail { flex-wrap:wrap; }
 .ts-wrap { margin-left:-14px; margin-right:-14px; }
 .code-float:not(.position-right) { top:auto; bottom:max(18px,env(safe-area-inset-bottom)); }
 .code-float.position-right { top:max(16px,env(safe-area-inset-top)); }
}

/** 语言检测：手动选择 > 浏览器首选语言 > 时区（大中华区） > 英文 */
function detectLang(){
  try {
    const saved = localStorage.getItem('cd_lang');
    if (saved === 'zh' || saved === 'en') return saved;
  } catch {}
  const first = String((navigator.languages && navigator.languages.length ? navigator.languages[0] : navigator.language) || '').toLowerCase();
  if (first.startsWith('zh')) return 'zh';
  if (first) return 'en';
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    if (/^Asia\/(Shanghai|Chongqing|Harbin|Urumqi|Kashgar|Hong_Kong|Macau|Taipei)$/.test(tz)) return 'zh';
  } catch {}
  return 'en';
}

  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
  return s;
};

const EXT_COLORS = {
  zip:'#ffb340', rar:'#ffb340', '7z':'#ffb340', tar:'#ffb340', gz:'#ffb340',
  pdf:'#ff6961', doc:'#5b9cf5', docx:'#5b9cf5', txt:'#9aa4b2', md:'#9aa4b2',

  apk:'#3ecf8e', exe:'#9aa4b2', iso:'#9aa4b2', dmg:'#9aa4b2', default:'#8ea0c8'
};
function extOf(name){ const m=/\.([a-z0-9]+)$/i.exec(name||''); return m?m[1].toLowerCase():''; }
function extColor(name){ return EXT_COLORS[extOf(name)]||EXT_COLORS.default; }
function fmtSize(n){
  if(!Number.isFinite(n))return '—';
  if(n<1024)return n+' B';
  const u=['KB','MB','GB','TB'];let i=-1;
  do{n/=1024;i++;}while(n>=1024&&i<u.length-1);
  return n.toFixed(n>=100?0:n>=10?1:2)+' '+u[i];
}
function fmtTime(ts){
  const d=new Date(ts),p=x=>String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const token = location.pathname.split('/')[2];

let turnstileScriptPromise = null;
function loadTurnstileScript(){
  if (window.turnstile) return Promise.resolve(window.turnstile);
  if (turnstileScriptPromise) return turnstileScriptPromise;
  turnstileScriptPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    let settled = false;
    const fail = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      script.remove();
      reject(new Error('ts_load_failed'));
    };
    const timer = setTimeout(fail, 15000);
    window.onTurnstileLoad = () => {
      if (settled) return;
      if (!window.turnstile) {fail();return;}
      settled = true;
      clearTimeout(timer);
      resolve(window.turnstile);
    };
    script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad';
    script.async = true;
    script.onerror = fail;
    document.head.appendChild(script);
  }).catch(error => {turnstileScriptPromise = null;throw error;});
  return turnstileScriptPromise;
}

/**
 * 渲染 Turnstile widget 并等待完成。
 * 返回 Promise<string> —— token 字符串。
 */
async function renderTurnstile(containerEl, sitekey){
  if(containerEl.dataset.tsWidgetId && window.turnstile) window.turnstile.remove(containerEl.dataset.tsWidgetId);
  window.__tsToken = null;
  containerEl.innerHTML = '<div role="status">'+esc(t('turnstileLoading'))+'</div>';
  await loadTurnstileScript();
  containerEl.innerHTML = '<div class="ts-wrap"><div class="ts-box"></div></div>';
  return await new Promise((resolve, reject) => {
    const id = window.turnstile.render(containerEl.querySelector('.ts-box'), {
      sitekey,
      theme: 'auto',
      callback: (tk) => resolve(tk),
      'expired-callback': () => { window.__tsToken = null; },
      'error-callback': code => {window.__tsToken = null;reject(new Error('ts_error_' + (code || 'unknown')));return true;},
      'timeout-callback': () => reject(new Error('ts_timeout')),
    });
    containerEl.dataset.tsWidgetId = id;
  });
}

async function boot(){
  // OAuth callback 返回的错误参数 → 页面顶部提示
  const params = new URLSearchParams(location.search);
  const oauthErr = params.get('oauth_error');

  let info;
  let oauthProviders = [];
  try{
    const r = await fetch(`/s/${token}/info`, {cache:'no-store'});
    if(!r.ok) throw 0;
    info = await r.json();
  }catch{ renderError(t('notFoundTitle'), t('notFoundMsg')); return; }
  // 如果 OAuth2 启用了，拉启用中的 Provider 列表来渲染多个按钮
  if (info.oauth?.enabled) {
    try {
      const r2 = await fetch('/oauth/providers', {cache:'no-store'});
      if (r2.ok) {
        const j = await r2.json();
        oauthProviders = j.providers || [];
      }
    } catch {}
  }
  const boundCode = getBoundCode();
  if(boundCode) {
    try {
      const response = await fetch('/api/codes/status?code=' + encodeURIComponent(boundCode), {cache:'no-store'});
      const status = await response.json();
      if(response.status === 404 || response.status === 400 || (response.ok && status.usable === false))
        localStorage.removeItem('r2pan_code');
    } catch {}
  }
  const siteName = info.site_title || 'nano-cloud';
  document.title = t('pageTitle', {site: siteName});
  $('#brand-text').innerHTML = `Powered by <b>${esc(siteName)}</b>`;
  render(info, siteName, oauthErr, oauthProviders);
}

    const resultBox = mask.querySelector('#code-query-result');
    mask.querySelector('#code-query').onclick = async () => {
      const code = input.value.trim().toUpperCase();
      if(!code) return;
      resultBox.style.display = 'block'; resultBox.className = 'code-query-result'; resultBox.textContent = '...';
      try {
        const r = await fetch('/api/codes/status?code=' + encodeURIComponent(code));
        const d = await r.json();
        const st = d.status || {};
        if(r.ok){
          const rem = st.remaining;
          if(rem === -1){ resultBox.textContent = t('codeCheckInfinite'); resultBox.className = 'code-query-result ok'; }
          else {
            const pct = st.pct || 0;
            resultBox.innerHTML = t('codeCheckOk', { remaining: fmtBytes(rem), total: st.total>0?fmtBytes(st.total):'∞' });
            if(pct > 0) resultBox.innerHTML += `<div class="code-progress"><i style="width:${pct}%"></i></div>`;
            resultBox.className = 'code-query-result ok';
          }
          if(!d.usable && d.reason){ resultBox.textContent += ' ⚠ ' + (d.message || statusMap[st.status] || d.reason); resultBox.className = 'code-query-result warn'; }
        } else {
          resultBox.textContent = d.message || t('codeCheckBad', {msg: 'not found'}); resultBox.className = 'code-query-result err';
        }
      } catch(err){ resultBox.textContent = t('codeCheckBad', {msg: err.message}); resultBox.className = 'code-query-result err'; }
    };

    // 绑定按钮（保存到 localStorage 并校验）
    mask.querySelector('#code-bind').onclick = async () => {
      const code = input.value.trim().toUpperCase();
      if(!code) return;
      resultBox.style.display = 'block'; resultBox.className = 'code-query-result'; resultBox.textContent = '...';
      try {
        const r = await fetch('/api/codes/status?code=' + encodeURIComponent(code));
        const d = await r.json();
        if(r.ok){
          if(!d.usable){
            resultBox.textContent = d.message || t('codeBindFailed', {msg: d.reason});
            resultBox.className = 'code-query-result err';
            return;
          }
          setBoundCode(code);
          updateCodeFloatBadge();
          resultBox.textContent = t('codeBindSuccess');
          resultBox.className = 'code-query-result ok';
          setTimeout(() => { close(); boot(); }, 800);
        } else {
          resultBox.textContent = d.message || t('codeBindFailed', {msg: 'not found'});
          resultBox.className = 'code-query-result err';
        }
      } catch(err){ resultBox.textContent = t('codeBindFailed', {msg: err.message}); resultBox.className = 'code-query-result err'; }
    };

    // 解绑按钮
    const unbindBtn = mask.querySelector('#code-unbind');
    if(unbindBtn){
      unbindBtn.onclick = () => {
        try {
          setBoundCode(null);
          updateCodeFloatBadge();
          close(); boot();
        } catch(error) {
          resultBox.textContent = t('codeBindFailed', {msg: error.message});
          resultBox.className = 'code-query-result err';
        }
      };
    }

    // Enter 键 → 绑定
    input?.addEventListener('keydown', e => {
      if(e.key === 'Enter') { e.preventDefault(); mask.querySelector('#code-bind').click(); }
    });
  }

  // 浮动按钮点击 → 打开弹窗
  document.getElementById('code-float').onclick = openCodeModal;
  if (needTsNow && !quotaBlocked) challengeToken(d, ts, tsEnabled, tsOnDownload).catch(() => {});


}

let challengePending = null;
async function challengeToken(d, ts, tsEnabled, tsOnDownload){
  if (!tsEnabled || !(tsOnDownload || ts.needs_now)) return null;
  if (window.__tsToken) return window.__tsToken;
  if (!challengePending) {
    const box = $('#ts-container') || document.createElement('div');
    if (!box.parentNode) document.body.appendChild(box);
    challengePending = renderTurnstile(box, ts.sitekey).then(tk => {
      window.__tsToken = tk;
      return tk;
    }).catch(error => {
      box.innerHTML = `<div class="ts-blocked-hint" role="alert">${esc(t(error.message === 'ts_load_failed' ? 'turnstileLoadFailed' : 'turnstileFail'))}</div><button class="btn" id="ts-retry">${esc(t('turnstileRetry'))}</button>`;
      box.querySelector('#ts-retry').onclick = () => {challengeToken(d, ts, tsEnabled, tsOnDownload).catch(() => {});};
      throw error;
    }).finally(() => { challengePending = null; });
  }
  return challengePending;
}
async function verifiedDownload(d, ts, tsEnabled, tsOnDownload, password){
  const tk = await challengeToken(d, ts, tsEnabled, tsOnDownload);
  const r = await fetch(`/s/${token}/verify`, { method:'POST', headers:{'content-type':'application/json'},
    body:JSON.stringify({password, turnstile:tk}) });
  let res;
  try {res = await r.json();} catch {window.__tsToken = null;throw new Error('verify_failed');}
  // A wrong password is checked before Siteverify, so its token remains usable.
  if (res.error !== 'bad_password') window.__tsToken = null;
  if (!r.ok || !res.url) throw new Error(res.error || 'verify_failed');
  const target = new URL(res.url, location.href);
  const code = getBoundCode();
  if(code) target.searchParams.set('code', code);
  location.href = target.href;
}
let downloadPending = false;
async function triggerDownload(d, ts, tsEnabled, tsOnDownload){
  if(downloadPending) return;
  downloadPending = true;
  try { await verifiedDownload(d, ts, tsEnabled, tsOnDownload); }
  catch(error) { alert(t(error.message === 'turnstile_failed' || error.message.startsWith('ts_') ? 'turnstileFail' : 'downloadFailed')); }
  finally { downloadPending = false; }
}
async function wireUnlock(d, ts, tsEnabled, tsOnDownload, oauthEnabled, oauthAuthed, oauthProviders){
  const btn = $('#pw-go'), input = $('#pw'), err = $('#pw-err');
  let pending = false;
  const unlock = async () => {
    if(pending || !input.value) return;
    if(oauthEnabled && !oauthAuthed){
      if(!oauthProviders[0]?.start_url){err.textContent = t('oauthUnavailable');return;}
      location.href = oauthProviders[0].start_url + '&redirect=' + encodeURIComponent(location.pathname);
      return;
    }
    pending = true; btn.disabled = true; err.textContent = '';
    try { await verifiedDownload(d, ts, tsEnabled, tsOnDownload, input.value); }
    catch(error){
      err.textContent = t(error.message === 'bad_password' ? 'wrongPassword' : error.message === 'turnstile_failed' || error.message.startsWith('ts_') ? 'turnstileFail' : 'downloadFailed');
      input.select();
    } finally { pending = false; btn.disabled = false; }
  };
  btn.onclick = unlock;
  input.addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });
}

boot();
</script>
